[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "soundboard"
version = "0.1.0"
description = "A simple, customizable software soundboard with live mic passthrough"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iota0zero2" }]
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "PySide6>=6.6",
    "pynput>=1.7",
]

[project.scripts]
soundboard = "soundboard.__main__:main"

[tool.setuptools]
packages = ["soundboard"]
